name: Deploy no GitHub Pages

on:
  push:
    branches:
      - main
      - claude/personal-org-app-sara-41l36a
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita dois deploys rodando ao mesmo tempo; não cancela um deploy em
# andamento para não publicar uma versão pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_PAGES: 'true'
          # Chaves da sincronização. Se os secrets não existirem, chegam vazias
          # e o app publicado roda em modo local — exatamente como antes, sem
          # quebrar nada. O passo a passo para criá-las está em CONFIGURACAO.md.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      # Dá ao cache do service worker uma versão nova a cada deploy — senão um
      # navegador que caia no modo offline fica preso na página de um deploy
      # antigo, apontando para um .js que o deploy seguinte já apagou.
      - run: sed -i "s/__BUILD_ID__/${GITHUB_SHA::7}/" dist/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
