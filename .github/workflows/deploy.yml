name: Deploy no GitHub Pages

on:
  push:
    branches:
      - main
      - claude/personal-org-app-sara-41l36a
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita dois deploys rodando ao mesmo tempo; não cancela um deploy em
# andamento para não publicar uma versão pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_PAGES: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
